name: Validate public content

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install template dependency
        run: pip install -r requirements.txt
      - name: Validate content consistency
        run: python scripts/validate_public_content.py
      - name: Build with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@v1
      - name: Validate rendered pages and historical documents
        run: python scripts/validate_built_site.py _site
